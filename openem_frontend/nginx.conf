# Rate limiting na borda (issue #87): segura uma inundação antes de ela chegar
# ao Node. É generoso de propósito: as regras de negócio (login, PDF, IA, fórum)
# ficam na API. 50 pedidos por segundo por IP, com folga de 200, cabem uma sala
# inteira atrás do mesmo NAT abrindo o app ao mesmo tempo.
# Com outro proxy ou CDN na frente deste nginx, $binary_remote_addr vira o IP
# dele: configure set_real_ip_from + real_ip_header (ver a documentação de
# produção), junto com o TRUST_PROXY da API.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

# HTML sempre revalidado: sem Cache-Control, o navegador estima um prazo e pode
# reabrir uma página antiga que aponta para arquivos que o deploy já trocou
# (aconteceu com os endereços do app quando ele foi para /app/). Os arquivos
# com hash no nome (assets/) continuam no cache normal. Valor vazio = sem
# cabeçalho.
map $sent_http_content_type $cache_do_html {
  ~^text/html no-cache;
  default "";
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Não anuncia a versão do nginx nas respostas e páginas de erro.
  server_tokens off;
  # Texto em UTF-8 (HTML, robots.txt, llms.txt...): sem o charset no
  # Content-Type, o navegador pode ler os .txt como Latin-1 e quebrar acentos.
  charset utf-8;
  # Redirecionamentos com caminho relativo (Location: /app/...). Atrás do proxy
  # HTTPS, este nginx recebe HTTP, e o Location absoluto saía com http://: o
  # aluno passava por HTTP antes de o proxy mandar de volta para HTTPS.
  absolute_redirect off;

  # Encaminha API e healthcheck para o backend (nome do serviço no compose).
  # O X-Forwarded-For leva o IP do aluno: a API (TRUST_PROXY=1) lê o último
  # endereço da lista, o que o nginx acrescenta, e ignora o que o cliente mandou.
  location /api/ {
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;
    # O mesmo formato do 429 da API, com Retry-After, para o app tratar igual.
    error_page 429 = @limitado;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location @limitado {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"statusCode":429,"message":"Muitas tentativas. Tente de novo em 1 s."}';
  }
  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Imagens das questões oficiais do ENEM (volume do backend). Precisa vir
  # ANTES do fallback de SPA: sem isso, cada <img> receberia o index.html com
  # status 200 — falha silenciosa, não um 404 visível.
  location /media/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Endereços antigos do app, de quando ele morava na raiz (issue #88): 301
  # para o mesmo caminho em /app/, com a query, para não quebrar favoritos nem
  # links compartilhados no fórum. A lista são as rotas do App.tsx;
  # nginx-rotas.test.ts cobra que nenhuma fique de fora.
  location ~ ^/(login|onboarding|painel|questoes|simulados|desempenho|revisao|progresso|conquistas|cronograma|pomodoro|cronometros|ferramentas|redacoes|comunidade|perfil|temas|usuarios|favoritos|flashcards|formulas|tabela-periodica|videos|quadro)(/.*)?$ {
    return 301 /app$request_uri;
  }

  # App (PWA), em /app/. Fallback de SPA para o index.html dele.
  #
  # Cabeçalhos de segurança do app (a API recebe os do helmet, por isso ficam só
  # aqui). A CSP só aceita script da própria origem, sem 'unsafe-inline': o boot
  # do tema é o arquivo /app/theme-boot.js. As exceções são o que o app usa de
  # fora: o player do YouTube sem cookies (Vídeos) e imagens https de flashcards
  # do aluno. As fontes são do próprio app (fontsource), sem Google Fonts.
  # nginx-csp.test.ts confere esta linha contra o código.
  location /app/ {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_do_html always;
    try_files $uri $uri/ /app/index.html;
  }
  location = /app {
    return 301 /app/;
  }

  # Site público (openem_site): a landing em / e a documentação em /docs/,
  # páginas HTML estáticas (cada uma em <caminho>/index.html). A CSP é mais
  # fechada que a do app: as fontes são do próprio site, e não há vídeo nem
  # imagem de fora. /sw.js é o service worker que desliga o do app antigo.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control $cache_do_html always;
    try_files $uri $uri/index.html $uri/ =404;
  }
}
