# Rate limiting na borda (issue #87): segura uma inundação antes de ela chegar
# ao Node. É generoso de propósito: as regras de negócio (login, PDF, IA, fórum)
# ficam na API. 50 pedidos por segundo por IP, com folga de 200, cabem uma sala
# inteira atrás do mesmo NAT abrindo o app ao mesmo tempo.
# Com outro proxy ou CDN na frente deste nginx, $binary_remote_addr vira o IP
# dele: configure set_real_ip_from + real_ip_header (ver a documentação de
# produção), junto com o TRUST_PROXY da API.
limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Não anuncia a versão do nginx nas respostas e páginas de erro.
  server_tokens off;

  # Encaminha API e healthcheck para o backend (nome do serviço no compose).
  # O X-Forwarded-For leva o IP do aluno: a API (TRUST_PROXY=1) lê o último
  # endereço da lista, o que o nginx acrescenta, e ignora o que o cliente mandou.
  location /api/ {
    limit_req zone=api burst=200 nodelay;
    limit_req_status 429;
    # O mesmo formato do 429 da API, com Retry-After, para o app tratar igual.
    error_page 429 = @limitado;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }
  location @limitado {
    default_type application/json;
    add_header Retry-After 1 always;
    return 429 '{"statusCode":429,"message":"Muitas tentativas. Tente de novo em 1 s."}';
  }
  location = /health {
    proxy_pass http://backend:3000/health;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Imagens das questões oficiais do ENEM (volume do backend). Precisa vir
  # ANTES do fallback de SPA: sem isso, cada <img> receberia o index.html com
  # status 200 — falha silenciosa, não um 404 visível.
  location /media/ {
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # SPA fallback.
  #
  # Cabeçalhos de segurança do app (a API recebe os do helmet, por isso ficam só
  # aqui). A CSP só aceita script da própria origem, sem 'unsafe-inline': o boot
  # do tema é o arquivo /theme-boot.js. As exceções são o que o app usa de fora:
  # Google Fonts (CSS e fontes, também buscados pelo service worker), o player
  # do YouTube sem cookies (Vídeos) e imagens https de flashcards do aluno.
  # nginx-csp.test.ts confere esta linha contra o código.
  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.youtube-nocookie.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    try_files $uri $uri/ /index.html;
  }
}
