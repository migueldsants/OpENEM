# Tabela de contribuidores do README (tools/contribuidores/). Refaz a tabela a
# partir do histórico da main (autores e coautores `Co-authored-by`) e, se ela
# mudou, abre ou atualiza um PR da branch bot/contribuidores. Em PR que mexe no
# gerador ou nos READMEs, só roda os testes.
#
# Para o workflow abrir o PR, o repositório precisa permitir em Settings >
# Actions > General: "Allow GitHub Actions to create and approve pull requests".
name: Contribuidores

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'tools/contribuidores/**'
      - '.github/workflows/contribuidores.yml'
      - 'README.md'
      - '.github/docs/README-EN.md'
  schedule:
    - cron: '0 9 * * 1' # segunda-feira, 6h em Brasília
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contribuidores-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testes do gerador
        run: node --test tools/contribuidores/tabela.test.mjs

  tabela:
    needs: testes
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refaz a tabela
        run: node tools/contribuidores/atualizar.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Abre ou atualiza o PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "A tabela já está em dia."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C bot/contribuidores
          git commit -am 'docs: atualiza a tabela de contribuidores'
          git push --force origin bot/contribuidores
          aberto=$(gh pr list --head bot/contribuidores --state open --json number --jq '.[].number')
          if [ -z "$aberto" ]; then
            gh pr create --base main --head bot/contribuidores \
              --title 'docs: atualiza a tabela de contribuidores' \
              --body 'Tabela refeita por `tools/contribuidores/atualizar.mjs` a partir do histórico da `main` (workflow `contribuidores.yml`).'
          fi
