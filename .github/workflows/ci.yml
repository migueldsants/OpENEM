name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
  workflow_dispatch:

# Cancela execuções antigas do mesmo ref quando há um novo push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openem_backend
    # Postgres e Redis só para a suíte e2e (que cria o próprio schema
    # `test_e2e`); os testes de unidade são puros e não abrem conexão. Com o
    # Redis, o e2e passa pelo cache de verdade (issue #86).
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: openem
          POSTGRES_PASSWORD: openem
          POSTGRES_DB: openem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openem -d openem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: valkey/valkey:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openem:openem@localhost:5432/openem?schema=public
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openem_backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Gerar Prisma Client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Testes unitários
        run: npm test

      # Coverage thresholds (issue #47): falha se a cobertura regredir.
      - name: Testes com coverage (thresholds)
        run: npm run test:cov

      - name: Testes e2e
        run: npm run test:e2e
        env:
          REDIS_URL: redis://localhost:6379

      # Mutation testing (issue #47) NÃO roda no CI: um run full leva
      # 45-80 min por job. Use `npm run test:mutation` localmente
      # (incremental) antes de PRs que mexam em lógica de domínio.

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openem_frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: openem_frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      # Coverage thresholds (issue #47): falha se a cobertura regredir.
      - name: Testes com coverage (thresholds)
        run: npm run test:cov

      # Mutation testing (issue #47) NÃO roda no CI (full = ~80 min):
      # use `npm run test:mutation` localmente (incremental).

      - name: Build
        run: npm run build

  site:
    name: Site (lint, test, build, links)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: openem_site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            openem_site/package-lock.json
            openem_frontend/package-lock.json

      # O site importa o CSS do app (que importa o tailwindcss das
      # dependências do app), então as duas instalações são necessárias.
      - name: Instalar dependências do app
        working-directory: openem_frontend
        run: npm ci

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build (pré-renderizado)
        run: npm run build
        env:
          SITE_URL: https://openem.exemplo

      - name: Links internos do build
        run: npm run check:links

  docker:
    name: Build de imagens Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend, site]
    steps:
      - uses: actions/checkout@v4

      - name: Build da imagem do backend
        run: docker build -t openem-backend:ci ./openem_backend

      # Contexto na raiz: a imagem leva o site (raiz) e o app (/app/).
      - name: Build da imagem do frontend
        run: docker build -f openem_frontend/Dockerfile -t openem-frontend:ci .

      # Publicação no registry fica desativada até haver hospedagem/VPS.
      # Ver docs/PRD.md §12.
