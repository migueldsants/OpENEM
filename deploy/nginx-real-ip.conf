# Montado pelo docker-compose.prod.yml em /etc/nginx/conf.d/. O Caddy, na rede
# do host, chega ao nginx pela porta 127.0.0.1:8080, e o Docker entrega essas
# conexões com o IP do gateway da rede interna, não o do aluno. Só a rede do
# Docker é confiável para o X-Forwarded-For: um pedido de fora não tem origem
# nessa faixa, então o cabeçalho de quem chega direto é ignorado.
# Se o Docker usa outra faixa (default-address-pools no daemon), troque aqui.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
