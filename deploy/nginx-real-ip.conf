# Montado pelo docker-compose.prod.yml em /etc/nginx/conf.d/. Atrás do Caddy, o
# IP que chega ao nginx é o do Caddy, não o do aluno. Só a rede do Docker é
# confiável para o X-Forwarded-For: um pedido de fora não tem origem nessa
# faixa, então o cabeçalho de quem chega direto é ignorado.
# Se o Docker usa outra faixa (default-address-pools no daemon), troque aqui.
set_real_ip_from 172.16.0.0/12;
real_ip_header X-Forwarded-For;
