# OpENEM — orquestração (dev local e VPS).
# PostgreSQL e Redis (Valkey) no mesmo compose (ver docs/PRD.md §12).
# Rode `docker compose up --build` com POSTGRES_PASSWORD, REDIS_PASSWORD e
# JWT_SECRET no .env da raiz. Para desenvolver só o backend:
# `docker compose up -d db` (o Redis é opcional em dev; ver README).

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openem}
      - POSTGRES_DB=${POSTGRES_DB:-openem}
      # Obrigatório: sem senha o compose nem sobe. Gere uma forte
      # (ex.: `openssl rand -hex 24`); só letras e números, porque ela entra
      # crua na DATABASE_URL do backend.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}
    ports:
      # Só na máquina local (127.0.0.1), nunca na rede: serve ao backend rodando
      # fora do Docker em dev (`npm run start:dev`) e a um psql/pg_dump no
      # próprio servidor. O backend do compose usa a rede interna (host `db`).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cache compartilhado da API (issue #86). Valkey é o fork aberto (BSD) do
  # Redis e fala o mesmo protocolo. É só cache: sem persistência em disco, e
  # cheio ele descarta as chaves menos usadas. Se cair, a API lê do banco.
  redis:
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    environment:
      # Obrigatória, como a do banco. Só letras e números (ela entra crua na
      # REDIS_URL do backend). Ex.: openssl rand -hex 24
      - REDIS_PASSWORD=${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env (openssl rand -hex 24)}
    command:
      - sh
      - -c
      - >-
        exec valkey-server --requirepass "$$REDIS_PASSWORD"
        --maxmemory ${REDIS_MAXMEMORY:-128mb} --maxmemory-policy allkeys-lru
        --save '' --appendonly no
    ports:
      # Só na máquina local, como o banco: serve ao backend de dev fora do
      # Docker. O backend do compose usa a rede interna (host `redis`).
      - '127.0.0.1:${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep -q PONG']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./openem_backend
    # Volta sozinho se o processo cair (sem isso, uma queda deixava a API fora
    # do ar até alguém subir de novo).
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openem}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openem}?schema=public
      # Cache compartilhado entre as instâncias da API e os scripts de import.
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # Imagens das questões oficiais do ENEM, gravadas por `db:import:enem`.
      # Ficam num volume próprio: são saída do import e precisam sobreviver ao
      # rebuild da imagem (que não as contém, ver .dockerignore).
      - ENEM_MEDIA_DIR=/data/enem-media
      # Na primeira subida, com o banco sem questões oficiais, o container roda
      # sozinho seed, import das provas, classificação por palavra-chave e
      # flashcards (prisma/bootstrap.ts). Precisa de internet para baixar o
      # dataset, que fica no volume. AUTO_IMPORT=0 desliga.
      - AUTO_IMPORT=${AUTO_IMPORT:-1}
      - ENEM_DATASET_DIR=/data/enem-dataset
      - PORT=3000
      - NODE_ENV=production
      # Obrigatório: sem JWT_SECRET a API falha a inicialização em produção.
      # Gere um segredo forte (ex.: `openssl rand -hex 32`) e exporte antes do up.
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # Endereço público: o link do e-mail de redefinição de senha e a volta do
      # login com Google saem dele, nunca do cabeçalho Host do pedido.
      - SITE_URL=${SITE_URL:-}
      # Recuperação de senha por e-mail e login com Google, os dois opcionais
      # (ver /docs/hospedar/email-e-google/). Sem eles, o app fica só com
      # e-mail e senha.
      - SMTP_URL=${SMTP_URL:-}
      - MAIL_FROM=${MAIL_FROM:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      # O nginx do frontend é o único proxy à frente da API. Sem isso o rate
      # limiting vê só o IP do container e trata o site inteiro como um cliente
      # (10 senhas erradas bloqueariam o login de todos).
      - TRUST_PROXY=1
      # Provedor de IA — opcional. Serve o comentário gerado das questões e a
      # classificação de assunto; sem nenhuma chave configurada esses recursos
      # ficam indisponíveis e o resto do app segue igual. Ver
      # openem_backend/.env.example para detalhes de cada provedor.
      - AI_PROVIDER=${AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      # Cota das chamadas pagas à IA (24 h). Vazio usa o padrão do backend:
      # 30 comentários por aluno, sem teto global. Em produção, defina
      # AI_DAILY_LIMIT (soma de todos os alunos) para limitar o custo.
      - AI_EXPLANATION_DAILY_LIMIT=${AI_EXPLANATION_DAILY_LIMIT:-}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-}
    ports:
      # Só na máquina local: com TRUST_PROXY ligado, quem chegasse direto na
      # porta 3000 pela rede poderia forjar o X-Forwarded-For e escapar do rate
      # limiting. De fora, o acesso é pelo nginx (porta 8080).
      - '127.0.0.1:3000:3000'
    volumes:
      - enem-media:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      # A primeira subida popula o banco antes de a API responder.
      start_period: 15m

  # nginx com o site público na raiz (landing e /docs/) e o app em /app/
  # (issue #88). O contexto é a raiz: o site usa o CSS e os dados do app.
  frontend:
    build:
      context: .
      dockerfile: openem_frontend/Dockerfile
      args:
        # Domínio da instalação, para o sitemap e o Open Graph (opcional).
        - SITE_URL=${SITE_URL:-}
    restart: unless-stopped
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg-data:
  enem-media:
