# OpENEM — orquestração local (Fase 0).
# Banco SQLite em volume nomeado; produção -> PostgreSQL (ver docs/PRD.md §12).
# Sem deploy remoto por enquanto: rode `docker compose up --build` na sua máquina.

services:
  backend:
    build: ./openem_backend
    environment:
      - DATABASE_URL=file:/data/prod.db
      # Imagens das questões oficiais do ENEM, gravadas por `db:import:enem`.
      # Ficam no MESMO volume do banco: ambas são saída do import e precisam
      # sobreviver ao rebuild da imagem (que não as contém, ver .dockerignore).
      - ENEM_MEDIA_DIR=/data/enem-media
      - PORT=3000
      - NODE_ENV=production
      # Obrigatório: sem JWT_SECRET a API falha a inicialização em produção.
      # Gere um segredo forte (ex.: `openssl rand -hex 32`) e exporte antes do up.
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # Correção de redação por IA (Fase 3) — opcionais. Sem nenhuma chave
      # configurada a correção por IA fica indisponível e o app recai na rubrica
      # manual. Ver openem_backend/.env.example para detalhes de cada provedor.
      - ESSAY_AI_PROVIDER=${ESSAY_AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    ports:
      - '3000:3000'
    volumes:
      - sqlite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./openem_frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  sqlite-data:
