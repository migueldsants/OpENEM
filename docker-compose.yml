# OpENEM — orquestração (dev local e VPS).
# PostgreSQL no mesmo compose, com volume nomeado (ver docs/PRD.md §12).
# Rode `docker compose up --build` com POSTGRES_PASSWORD e JWT_SECRET no .env
# da raiz. Para desenvolver só o backend: `docker compose up -d db` (ver README).

services:
  db:
    image: postgres:17-alpine
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openem}
      - POSTGRES_DB=${POSTGRES_DB:-openem}
      # Obrigatório: sem senha o compose nem sobe. Gere uma forte
      # (ex.: `openssl rand -hex 24`); só letras e números, porque ela entra
      # crua na DATABASE_URL do backend.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env (openssl rand -hex 24)}
    ports:
      # Só na máquina local (127.0.0.1), nunca na rede: serve ao backend rodando
      # fora do Docker em dev (`npm run start:dev`) e a um psql/pg_dump no
      # próprio servidor. O backend do compose usa a rede interna (host `db`).
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./openem_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-openem}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-openem}?schema=public
      # Imagens das questões oficiais do ENEM, gravadas por `db:import:enem`.
      # Ficam num volume próprio: são saída do import e precisam sobreviver ao
      # rebuild da imagem (que não as contém, ver .dockerignore).
      - ENEM_MEDIA_DIR=/data/enem-media
      - PORT=3000
      - NODE_ENV=production
      # Obrigatório: sem JWT_SECRET a API falha a inicialização em produção.
      # Gere um segredo forte (ex.: `openssl rand -hex 32`) e exporte antes do up.
      - JWT_SECRET=${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -hex 32)}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      # O nginx do frontend é o único proxy à frente da API. Sem isso o rate
      # limiting vê só o IP do container e trata o site inteiro como um cliente
      # (10 senhas erradas bloqueariam o login de todos).
      - TRUST_PROXY=1
      # Correção de redação por IA (Fase 3) — opcionais. Sem nenhuma chave
      # configurada a correção por IA fica indisponível e o app recai na rubrica
      # manual. Ver openem_backend/.env.example para detalhes de cada provedor.
      - ESSAY_AI_PROVIDER=${ESSAY_AI_PROVIDER:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
    ports:
      # Só na máquina local: com TRUST_PROXY ligado, quem chegasse direto na
      # porta 3000 pela rede poderia forjar o X-Forwarded-For e escapar do rate
      # limiting. De fora, o acesso é pelo nginx (porta 8080).
      - '127.0.0.1:3000:3000'
    volumes:
      - enem-media:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then(r=>process.exit(r.status===200?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build: ./openem_frontend
    ports:
      - '8080:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pg-data:
  enem-media:
